[build]
  functions = "netlify/functions"
  command = "npm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"

# Security headers for every page
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "frame-ancestors 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Photos are cached for a week. If you replace a photo, give it a new file name.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Local testing with `netlify dev`: serve the source files directly (no build
# step), so edits show up on reload. Open http://localhost:8888
[dev]
  framework = "#static"
  publish = "."
  port = 8888

# The email-OTP login gate is switched OFF (site is public).
# To turn it back on: move netlify/disabled/gate.js to
# netlify/edge-functions/gate.js and add back:
#
# [[edge_functions]]
#   path = "/*"
#   function = "gate"
