<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Moon's Kitchen</title>
<link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png" />
<link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/login.css" />
</head>
<body class="login-body">

  <main class="login-wrap">
    <div class="login-card reveal visible">
      <div class="login-logo">
        <span class="logo-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a.6.6 0 0 0-.8-.7A9.8 9.8 0 1 0 21.2 15.4a.6.6 0 0 0-.7-.8z"/></svg></span>
        <span class="logo-text">Moon's<small>Kitchen</small></span>
      </div>
      <p class="login-sub">Sign in to your account &mdash; it's optional, you can keep browsing without it.</p>

      <div id="googleBlock" class="login-google hidden">
        <div id="googleBtn"></div>
        <div class="login-divider"><span>or sign in with an email code</span></div>
      </div>

      <form id="emailForm" class="login-form">
        <label for="emailInput" class="login-label">Email Address</label>
        <input type="email" id="emailInput" class="login-input" placeholder="you@example.com"
               autocomplete="email" required />
        <button type="submit" class="btn btn-dark login-btn" id="sendOtpBtn">
          Send OTP
        </button>
      </form>

      <form id="otpForm" class="login-form hidden">
        <label for="otpInput" class="login-label">Enter the 6-digit code sent to <span id="emailDisplay"></span></label>
        <input type="text" id="otpInput" class="login-input login-otp-input" placeholder="••••••"
               inputmode="numeric" maxlength="6" autocomplete="one-time-code" required />
        <button type="submit" class="btn btn-dark login-btn" id="verifyBtn">
          Verify &amp; Continue
        </button>
        <div class="login-links">
          <button type="button" class="login-link" id="resendBtn">Resend OTP</button>
          <button type="button" class="login-link" id="changeEmailBtn">Change email</button>
        </div>
      </form>

      <p class="login-error" id="loginError" role="alert"></p>

      <a href="index.html" class="login-back">&larr; Continue without signing in</a>
      <p class="login-sub" style="margin:1.2em 0 0;font-size:0.78rem;">By signing in you agree to our <a href="privacy.html">Privacy Policy</a>.</p>
    </div>
  </main>

  <script src="js/script.js"></script>
  <script src="js/login.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</body>
</html>
